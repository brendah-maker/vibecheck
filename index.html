<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VibeCheck Rapid-Fire</title>
    <!-- Library for sharing card generation -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #25D366; /* WhatsApp Green */
            --dark: #121b22;
            --light: #f0f2f5;
            /* Mesh Colors */
            --c1: #4f46e5; --c2: #ec4899; --c3: #06b6d4; --c4: #f59e0b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
            /* Animated Background */
            background-color: #000;
            background-image: 
                radial-gradient(at 0% 0%, var(--c1) 0px, transparent 50%),
                radial-gradient(at 100% 0%, var(--c2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, var(--c3) 0px, transparent 50%),
                radial-gradient(at 0% 100%, var(--c4) 0px, transparent 50%);
            background-size: 200% 200%;
            animation: gradientMove 15s ease infinite;
        }

        @keyframes gradientMove { 0% { background-position: 0% 0%; } 50% { background-position: 100% 100%; } 100% { background-position: 0% 0%; } }

        .game-container {
            width: 100%;
            max-width: 450px;
            height: calc(100vh - 60px); /* Space for Sticky Ad */
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        /* --- Screens --- */
        .screen { display: none; flex-direction: column; height: 100%; animation: fadeIn 0.3s ease; }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Progress Bar --- */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }

        /* --- Text Styling --- */
        #round-indicator { color: #fff; font-size: 0.9rem; font-weight: bold; letter-spacing: 1px; text-align: center; }
        #question-wording { color: #fff; font-size: 1.8rem; font-weight: 800; text-align: center; margin: 15px 0 30px 0; }

        /* --- Choice Cards (Hot Take Style) --- */
        .choices-wrapper { display: flex; flex-direction: column; gap: 15px; flex-grow: 1; justify-content: center; }
        
        .choice-btn {
            background: rgba(255, 255, 255, 0.95);
            border: none;
            padding: 30px 20px;
            border-radius: 16px;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--dark);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s;
            border-left: 6px solid var(--primary); /* Reference to Hot Take style */
        }
        .choice-btn:active { transform: scale(0.96); background: #eee; }

        .vs-text { text-align: center; color: #fff; font-style: italic; font-weight: bold; opacity: 0.7; margin: 5px 0; }

        /* --- Result Card --- */
        #result-card {
            background: #fff;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            color: var(--dark);
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .personality-type { font-size: 2rem; font-weight: 800; color: var(--primary); margin: 10px 0; }

        /* --- Sticky Ad --- */
        .ad-banner-sticky {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 450px;
            height: 60px;
            background-color: #121b22;
            color: #777;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            z-index: 100;
            border-top: 1px solid #333;
        }

        button.share-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- START SCREEN -->
        <div id="screen-start" class="screen active" style="justify-content: center; text-align: center;">
            <h1 style="color:white; font-size: 3rem;">VibeCheck</h1>
            <p style="color:white; opacity: 0.9;">10 Rounds. Your Style revealed.</p>
            <button class="choice-btn" onclick="startGame()" style="border-left: none; background: var(--primary); color: white;">Start Rapid-Fire</button>
        </div>

        <!-- GAME SCREEN -->
        <div id="screen-game" class="screen">
            <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
            <div id="round-indicator">ROUND 1 / 10</div>
            
            <!-- This is the "Wording" that fills the gap from your image -->
            <div id="question-wording">Pick your Vibe</div>

            <div class="choices-wrapper">
                <button class="choice-btn" id="choice-a" onclick="handleChoice('A')">Choice A</button>
                <div class="vs-text">vs</div>
                <button class="choice-btn" id="choice-b" onclick="handleChoice('B')">Choice B</button>
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="screen-result" class="screen">
            <div id="result-card">
                <div style="text-transform: uppercase; letter-spacing: 1px; font-weight: bold; font-size: 0.8rem; opacity: 0.6;">Your Persona</div>
                <div class="personality-type" id="vibe-title">Aesthetic Nomad</div>
                <div id="vibe-stats" style="text-align: left; margin-top: 15px;"></div>
                <p style="font-size: 0.7rem; margin-top: 20px; opacity: 0.5;">Play at: YourSite.com</p>
            </div>

            <button class="share-btn" onclick="shareToWhatsApp()">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.319 1.592 5.448 0 9.886-4.438 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.735-.981z"/></svg>
                Post to WhatsApp Status
            </button>
        </div>
    </div>

    <!-- STICKY AD SPACE -->
    <div class="ad-banner-sticky">
        ADVERTISEMENT BANNER SPACE (320x50)
    </div>

    <script>
        const gameData = [
            { cat: "Morning Vibes", a: "☕ Coffee", b: "🍵 Tea", traitA: "High Energy", traitB: "Mindful" },
            { cat: "Daily Rhythm", a: "🌅 Sunrise", b: "🌇 Sunset", traitA: "Early Bird", traitB: "Night Owl" },
            { cat: "Living Style", a: "🏙️ City Life", b: "🌲 Nature", traitA: "Urbanist", traitB: "Explorer" },
            { cat: "Social Battery", a: "📱 Texting", b: "📞 Calling", traitA: "Introvert", traitB: "Extrovert" },
            { cat: "Treat Yourself", a: "🍕 Pizza", b: "🥗 Salad", traitA: "Soul Foodie", traitB: "Health Nut" },
            { cat: "Fashion", a: "👟 Sneakers", b: "👞 Formal", traitA: "Casual", traitB: "Sleek" },
            { cat: "Content", a: "🎬 Movies", b: "📖 Books", traitA: "Visualizer", traitB: "Thinker" },
            { cat: "Escapism", a: "✈️ Travel", b: "🏠 Home", traitA: "Wanderer", traitB: "Homebody" },
            { cat: "Focus", a: "🎧 Music", b: "🎙️ Podcast", traitA: "Dreamer", traitB: "Learner" },
            { cat: "Ambition", a: "🎨 Create", b: "🍿 Consume", traitA: "Maker", traitB: "Enjoyer" }
        ];

        let currentStep = 0;
        let scores = {};

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startGame() {
            showScreen('screen-game');
            updateUI();
        }

        function updateUI() {
            const q = gameData[currentStep];
            document.getElementById('round-indicator').innerText = `ROUND ${currentStep + 1} / 10`;
            document.getElementById('question-wording').innerText = q.cat;
            document.getElementById('choice-a').innerText = q.a;
            document.getElementById('choice-b').innerText = q.b;
            document.getElementById('progress').style.width = ((currentStep / 10) * 100) + "%";
        }

        function handleChoice(side) {
            const q = gameData[currentStep];
            const trait = (side === 'A') ? q.traitA : q.traitB;
            scores[trait] = (scores[trait] || 0) + 1;

            currentStep++;
            if (currentStep < gameData.length) {
                updateUI();
            } else {
                showResults();
            }
        }

        function showResults() {
            showScreen('screen-result');
            const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
            const title = (sorted[0] ? sorted[0][0] : "Mysterious") + " " + (sorted[1] ? sorted[1][0] : "Soul");
            document.getElementById('vibe-title').innerText = title;

            let statsHtml = "";
            sorted.slice(0, 3).forEach(([name, count]) => {
                const pct = Math.min(95, (count / 3) * 100);
                statsHtml += `
                    <div style="margin-bottom:10px;">
                        <div style="display:flex; justify-content:space-between; font-size:0.8rem; margin-bottom:4px;">
                            <span>${name}</span><span>${Math.floor(pct)}%</span>
                        </div>
                        <div style="height:6px; background:#eee; border-radius:10px;">
                            <div style="height:100%; background:var(--primary); border-radius:10px; width:${pct}%"></div>
                        </div>
                    </div>`;
            });
            document.getElementById('vibe-stats').innerHTML = statsHtml;
        }

        async function shareToWhatsApp() {
            const card = document.getElementById('result-card');
            const canvas = await html2canvas(card, { backgroundColor: '#ffffff', scale: 2 });
            const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
            const file = new File([blob], 'vibe-result.png', { type: 'image/png' });
            const text = `Check my VibeCheck result! Play here: ${window.location.href}`;

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({ files: [file], title: 'VibeCheck', text: text });
            } else {
                window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
            }
        }
    </script>
</body>
</html>
