<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VibeCheck | This or That</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --accent: #f093fb;
            --bg: #09090b;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(240, 147, 251, 0.15) 0px, transparent 50%);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* Prevents bouncing on mobile */
        }

        #mobile-container {
            width: 100%;
            max-width: 430px; /* iPhone 15 Pro Max width */
            height: 100%;
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Screens */
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            animation: fadeIn 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .screen.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Typography */
        h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 8px; letter-spacing: -1px; }
        p { color: rgba(255,255,255,0.6); line-height: 1.5; }

        /* Game UI */
        .header { margin-top: 40px; text-align: center; }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.4s ease;
        }

        .question-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 16px;
        }

        .choice-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 40px 20px;
            border-radius: 24px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }

        .choice-card:active {
            transform: scale(0.96);
            background: rgba(255,255,255,0.15);
            border-color: var(--primary);
        }

        /* Result Card */
        #result-card {
            background: linear-gradient(165deg, #1e1e2d 0%, #09090b 100%);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 32px;
            padding: 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .vibe-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: var(--primary); font-weight: 800; }
        .vibe-title { font-size: 2.2rem; font-weight: 800; margin: 12px 0 24px 0; background: linear-gradient(to right, #fff, #a1a1aa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .stat-line { margin-bottom: 16px; }
        .stat-info { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 6px; }
        .stat-outer { height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; }
        .stat-inner { height: 100%; background: var(--secondary); border-radius: 10px; }

        /* Buttons */
        .btn-main {
            background: white;
            color: black;
            border: none;
            padding: 20px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }

        .btn-whatsapp {
            background: #25D366;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }

        .footer-note { font-size: 0.75rem; text-align: center; margin-top: 15px; opacity: 0.5; }

    </style>
</head>
<body>

<div id="mobile-container">

    <!-- START SCREEN -->
    <div id="screen-start" class="screen active">
        <div class="header">
            <h1>The Vibe<br>Check.</h1>
            <p>10 rapid-fire questions to reveal your true lifestyle aesthetic.</p>
        </div>
        <div class="question-area">
            <button class="btn-main" onclick="startGame()">Start Game</button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="screen-game" class="screen">
        <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
        <div id="round-indicator" style="font-size: 0.8rem; font-weight: 700; color: var(--primary);">ROUND 1</div>
        <div class="question-area">
            <div class="choice-card" id="choice-a" onclick="handleSelect('A')">Choice A</div>
            <div style="text-align: center; font-style: italic; opacity: 0.3;">vs</div>
            <div class="choice-card" id="choice-b" onclick="handleSelect('B')">Choice B</div>
        </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="screen-result" class="screen">
        <div id="result-card">
            <div class="vibe-label">Your Identity</div>
            <div class="vibe-title" id="final-vibe">The Aesthetic Explorer</div>
            <div id="stats-container"></div>
            <div style="margin-top: 30px; font-size: 0.7rem; opacity: 0.4;">PLAYED AT YOURWEBSITE.COM</div>
        </div>

        <button class="btn-main btn-whatsapp" onclick="shareToWhatsApp()">
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.319 1.592 5.448 0 9.886-4.438 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.735-.981z"/></svg>
            Share to WhatsApp Status
        </button>
        <p class="footer-note">Challenge your friends to beat your vibe!</p>
    </div>

</div>

<script>
    const gameData = [
        { a: "☕ Coffee", b: "🍵 Tea", traitA: "High Energy", traitB: "Mindful" },
        { a: "🌅 Sunrise", b: "🌇 Sunset", traitA: "Early Bird", traitB: "Night Owl" },
        { a: "🏙️ City", b: "🌲 Nature", traitA: "Urbanist", traitB: "Adventurer" },
        { a: "📱 Texting", b: "📞 Calling", traitA: "Introvert", traitB: "Extrovert" },
        { a: "🍕 Pizza", b: "🥗 Salad", traitA: "Soul Foodie", traitB: "Health Nut" },
        { a: "👟 Sneakers", b: "👞 Formal", traitA: "Casual", traitB: "Sleek" },
        { a: "🎬 Movies", b: "📖 Books", traitA: "Visualizer", traitB: "Thinker" },
        { a: "✈️ Travel", b: "🏠 Home", traitA: "Wanderer", traitB: "Coziness" },
        { a: "🎧 Music", b: "🎙️ Podcast", traitA: "Dreamer", traitB: "Learner" },
        { a: "🎨 Create", b: "🍿 Consume", traitA: "Artist", traitB: "Connoisseur" }
    ];

    let currentStep = 0;
    let scores = {};

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function startGame() {
        showScreen('screen-game');
        updateQuestion();
    }

    function updateQuestion() {
        const q = gameData[currentStep];
        document.getElementById('round-indicator').innerText = `ROUND ${currentStep + 1} / 10`;
        document.getElementById('choice-a').innerText = q.a;
        document.getElementById('choice-b').innerText = q.b;
        document.getElementById('progress').style.width = ((currentStep / 10) * 100) + "%";
    }

    function handleSelect(side) {
        const q = gameData[currentStep];
        const trait = (side === 'A') ? q.traitA : q.traitB;
        scores[trait] = (scores[trait] || 0) + 1;

        currentStep++;
        if (currentStep < gameData.length) {
            updateQuestion();
        } else {
            finishGame();
        }
    }

    function finishGame() {
        showScreen('screen-result');
        const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
        
        // Name logic
        const p1 = sorted[0] ? sorted[0][0] : "Mysterious";
        const p2 = sorted[1] ? sorted[1][0] : "Spirit";
        document.getElementById('final-vibe').innerText = `${p1} ${p2}`;

        // Stats logic
        let html = "";
        sorted.slice(0, 4).forEach(([name, count]) => {
            const pct = Math.floor((count / 3) * 100); // Visual flair: weight it to look higher
            const randomPct = Math.min(95, pct > 0 ? pct : Math.floor(Math.random() * 40) + 20);
            html += `
                <div class="stat-line">
                    <div class="stat-info"><span>${name}</span><span>${randomPct}%</span></div>
                    <div class="stat-outer"><div class="stat-inner" style="width: ${randomPct}%"></div></div>
                </div>
            `;
        });
        document.getElementById('stats-container').innerHTML = html;
    }

    async function shareToWhatsApp() {
        const card = document.getElementById('result-card');
        const vibe = document.getElementById('final-vibe').innerText;
        
        // Capture image
        const canvas = await html2canvas(card, {
            backgroundColor: '#09090b',
            scale: 2,
            borderRadius: 32
        });
        
        const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
        const file = new File([blob], 'my-vibe.png', { type: 'image/png' });

        const text = `I'm a ${vibe}! Check your vibe here: ${window.location.href}`;

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
                await navigator.share({
                    files: [file],
                    title: 'My Vibe Check',
                    text: text
                });
            } catch (e) {
                window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
            }
        } else {
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
        }
    }
</script>

</body>
</html>
