<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VibeCheck Rapid-Fire</title>
    <!-- Library for sharing card generation -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #25D366; /* WhatsApp Green */
            --dark: #121b22;
            --light: #f0f2f5;
            /* Mesh Colors */
            --c1: #4f46e5; --c2: #ec4899; --c3: #06b6d4; --c4: #f59e0b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
            background-color: #000;
            background-image: 
                radial-gradient(at 0% 0%, var(--c1) 0px, transparent 50%),
                radial-gradient(at 100% 0%, var(--c2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, var(--c3) 0px, transparent 50%),
                radial-gradient(at 0% 100%, var(--c4) 0px, transparent 50%);
            background-size: 200% 200%;
            animation: gradientMove 15s ease infinite;
        }

        @keyframes gradientMove { 0% { background-position: 0% 0%; } 50% { background-position: 100% 100%; } 100% { background-position: 0% 0%; } }

        .game-container {
            width: 100%;
            max-width: 450px;
            height: calc(100vh - 60px);
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        .screen { display: none; flex-direction: column; height: 100%; animation: fadeIn 0.3s ease; }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Progress Bar */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }

        /* Question Elements */
        #round-indicator { color: #fff; font-size: 0.9rem; font-weight: bold; letter-spacing: 1px; text-align: center; }
        #question-wording { color: #fff; font-size: 1.8rem; font-weight: 800; text-align: center; margin: 15px 0 20px 0; }

        .choices-wrapper { display: flex; flex-direction: column; gap: 12px; flex-grow: 1; justify-content: center; }
        
        .choice-btn {
            background: rgba(255, 255, 255, 0.95);
            border: none;
            padding: 25px 20px;
            border-radius: 16px;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--dark);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s;
            border-left: 6px solid var(--primary);
        }
        .choice-btn:active { transform: scale(0.96); background: #eee; }

        .vs-text { text-align: center; color: #fff; font-style: italic; font-weight: bold; opacity: 0.7; margin: 5px 0; }

        /* Result Card Styling */
        #result-card {
            background: #fff;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            color: var(--dark);
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .personality-type { font-size: 1.8rem; font-weight: 800; color: var(--primary); margin: 10px 0; line-height: 1.1; }
        .vibe-blurb { font-size: 0.9rem; color: #555; margin-bottom: 15px; line-height: 1.4; font-style: italic; border-top: 1px solid #eee; padding-top: 15px; }

        /* Ad Space */
        .ad-banner-sticky {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 450px;
            height: 60px;
            background-color: #121b22;
            color: #777;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            z-index: 100;
            border-top: 1px solid #333;
        }

        button.share-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- START SCREEN -->
        <div id="screen-start" class="screen active" style="justify-content: center; text-align: center;">
            <h1 style="color:white; font-size: 3rem; margin-bottom:0;">VibeCheck</h1>
            <p style="color:white; opacity: 0.9; margin-top:10px;">10 Rounds. Your Style revealed.</p>
            <button class="choice-btn" onclick="startGame()" style="border-left: none; background: var(--primary); color: white;">Start Rapid-Fire</button>
        </div>

        <!-- GAME SCREEN -->
        <div id="screen-game" class="screen">
            <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
            <div id="round-indicator">ROUND 1 / 10</div>
            <div id="question-wording">Pick your Vibe</div>
            <div class="choices-wrapper">
                <button class="choice-btn" id="choice-a" onclick="handleChoice('A')">Choice A</button>
                <div class="vs-text">vs</div>
                <button class="choice-btn" id="choice-b" onclick="handleChoice('B')">Choice B</button>
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="screen-result" class="screen">
            <div id="result-card">
                <div style="text-transform: uppercase; letter-spacing: 1px; font-weight: bold; font-size: 0.7rem; opacity: 0.5;">Your Vibe Profile</div>
                <div class="personality-type" id="vibe-title">Aesthetic Nomad</div>
                <div id="vibe-stats" style="text-align: left;"></div>
                <p style="font-size: 0.65rem; margin-top: 15px; opacity: 0.4;">CHECK YOURS AT: YOURWEBSITE.COM</p>
            </div>

            <button class="share-btn" onclick="shareToWhatsApp()">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.319 1.592 5.448 0 9.886-4.438 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.735-.981z"/></svg>
                Share to Status
            </button>
        </div>
    </div>

    <div class="ad-banner-sticky"><script async="async" data-cfasync="false" src="https://pl29472486.effectivecpmnetwork.com/cd5af648dff461ad812b3f2dc0c60367/invoke.js"></script>
<div id="container-cd5af648dff461ad812b3f2dc0c60367"></div>
</div>

    <script>
        const gameData = [
            { cat: "Morning Vibes", a: "☕ Coffee", b: "🍵 Tea", traitA: "High Energy", traitB: "Mindful" },
            { cat: "Daily Rhythm", a: "🌅 Sunrise", b: "🌇 Sunset", traitA: "Early Bird", traitB: "Night Owl" },
            { cat: "Living Style", a: "🏙️ City Life", b: "🌲 Nature", traitA: "Urbanist", traitB: "Explorer" },
            { cat: "Social Battery", a: "📱 Texting", b: "📞 Calling", traitA: "Introvert", traitB: "Extrovert" },
            { cat: "Treat Yourself", a: "🍕 Pizza", b: "🥗 Salad", traitA: "Soul Foodie", traitB: "Health Nut" },
            { cat: "Fashion", a: "👟 Sneakers", b: "👞 Formal", traitA: "Casual", traitB: "Sleek" },
            { cat: "Content", a: "🎬 Movies", b: "📖 Books", traitA: "Visualizer", traitB: "Thinker" },
            { cat: "Escapism", a: "✈️ Travel", b: "🏠 Home", traitA: "Wanderer", traitB: "Homebody" },
            { cat: "Focus", a: "🎧 Music", b: "🎙️ Podcast", traitA: "Dreamer", traitB: "Learner" },
            { cat: "Ambition", a: "🎨 Create", b: "🍿 Consume", traitA: "Maker", traitB: "Enjoyer" }
        ];

        const descriptions = {
            "High Energy": "You’re basically a sentient espresso shot. You don't walk into rooms; you 'spawn' into them with 100% volume.",
            "Mindful": "You have the inner peace of a rock in a stream. The world is ending, but you're just enjoying your tea.",
            "Early Bird": "You’re the reason 'Rise and Grind' exists. You’ve had three epiphanies before the rest of us found our socks.",
            "Night Owl": "You’re most powerful when everyone else is recharging. Your best work happens at 3 AM in the dark.",
            "Urbanist": "Main Character energy. You treat the sidewalk like a runway and the subway like your personal office.",
            "Explorer": "Your 'home' is basically just a storage unit for your luggage. You're allergic to staying in one zip code.",
            "Introvert": "A high-quality person who is currently 5 minutes away from leaving the party. Your bed is your sanctuary.",
            "Extrovert": "You feed on social interaction like a plant feeds on sunlight. Silence is your only enemy.",
            "Soul Foodie": "You don't eat for fuel; you eat for the plot. Life is too short for bland salads.",
            "Health Nut": "You’re 80% water and 20% pure discipline. You’ll probably outlive us all.",
            "Casual": "You make 'zero effort' look like a luxury brand. You're the CEO of being chill.",
            "Sleek": "You look like you've never had a hair out of place. Your aesthetic is 'unreachable but perfect.'",
            "Visualizer": "You see the world in Pinterest boards. Everything is a photo op if you look at it long enough.",
            "Thinker": "Your brain has 47 tabs open and 3 are playing music you can't find. You overanalyze (affectionately).",
            "Wanderer": "You’re not lost, you’re just 'scouting.' You have a PhD in finding the coolest hidden spots.",
            "Homebody": "You’ve mastered the 'soft life.' If it requires real shoes, you’re probably not going.",
            "Dreamer": "You live in a movie that hasn't been filmed yet. Real life is just a suggestion to you.",
            "Learner": "You’re a walking rabbit hole. You look up a recipe and end up studying 14th-century architecture.",
            "Maker": "You see a problem and think 'I could build that.' You're the architect of your own vibes.",
            "Enjoyer": "You’ve unlocked the secret to happiness: just liking stuff. No hate, just vibes and snacks."
        };

        const redFlags = [
            "Leaves people on read for 3-5 business days.",
            "Calls themselves the 'main character' unironically.",
            "Will argue about which water brand tastes best.",
            "Owns 5 different types of the same white t-shirt.",
            "Actually enjoys small talk (scary).",
            "Can't function without a specific morning ritual.",
            "Takes 'being chill' way too seriously."
        ];

        let currentStep = 0;
        let scores = {};

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startGame() {
            showScreen('screen-game');
            updateUI();
        }

        function updateUI() {
            const q = gameData[currentStep];
            document.getElementById('round-indicator').innerText = `ROUND ${currentStep + 1} / 10`;
            document.getElementById('question-wording').innerText = q.cat;
            document.getElementById('choice-a').innerText = q.a;
            document.getElementById('choice-b').innerText = q.b;
            document.getElementById('progress').style.width = ((currentStep / 10) * 100) + "%";
        }

        function handleChoice(side) {
            const q = gameData[currentStep];
            const trait = (side === 'A') ? q.traitA : q.traitB;
            scores[trait] = (scores[trait] || 0) + 1;

            currentStep++;
            if (currentStep < gameData.length) {
                updateUI();
            } else {
                showResults();
            }
        }

        function showResults() {
            showScreen('screen-result');
            const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
            const topTrait = sorted[0][0];
            const secondTrait = sorted[1] ? sorted[1][0] : "Spirit";
            
            document.getElementById('vibe-title').innerText = `${topTrait} ${secondTrait}`;
            
            const randomFlag = redFlags[Math.floor(Math.random() * redFlags.length)];
            
            let statsHtml = `
                <p class="vibe-blurb">${descriptions[topTrait]}</p>
                <div style="background: #fdf2f8; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px dashed #ec4899;">
                    <strong style="color:#ec4899; font-size:0.7rem;">⚠️ THE RED FLAG:</strong>
                    <p style="margin: 5px 0 0 0; font-size: 0.85rem; line-height:1.2;">${randomFlag}</p>
                </div>
                <div style="display:flex; justify-content: space-around; margin-bottom: 20px;">
                    <div style="text-align:center;"><div style="font-size:1.1rem;">✨</div><div style="font-size:0.6rem; opacity:0.6;">AURA</div><strong>+9,000</strong></div>
                    <div style="text-align:center;"><div style="font-size:1.1rem;">🔋</div><div style="font-size:0.6rem; opacity:0.6;">ENERGY</div><strong>${Math.floor(Math.random() * 50 + 50)}%</strong></div>
                    <div style="text-align:center;"><div style="font-size:1.1rem;">🎲</div><div style="font-size:0.6rem; opacity:0.6;">CHAOS</div><strong>${Math.floor(Math.random() * 100)}%</strong></div>
                </div>
            `;

            sorted.slice(0, 3).forEach(([name, count]) => {
                const pct = Math.min(95, (count / 4) * 100);
                statsHtml += `
                    <div style="margin-bottom:10px;">
                        <div style="display:flex; justify-content:space-between; font-size:0.65rem; margin-bottom:2px; font-weight:bold; color:#777;">
                            <span>${name.toUpperCase()} LEVEL</span><span>${Math.floor(pct)}%</span>
                        </div>
                        <div style="height:4px; background:#f0f0f0; border-radius:10px;">
                            <div style="height:100%; background:linear-gradient(90deg, var(--primary), #06b6d4); border-radius:10px; width:${pct}%"></div>
                        </div>
                    </div>`;
            });
            
            document.getElementById('vibe-stats').innerHTML = statsHtml;
        }

        async function shareToWhatsApp() {
            const card = document.getElementById('result-card');
            const canvas = await html2canvas(card, { backgroundColor: '#ffffff', scale: 2 });
            const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
            const file = new File([blob], 'vibe-result.png', { type: 'image/png' });
            const text = `I'm a ${document.getElementById('vibe-title').innerText}! See your VibeCheck result here:`;

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({ files: [file], title: 'VibeCheck', text: text + " " + window.location.href });
            } else {
                window.open(`https://wa.me/?text=${encodeURIComponent(text + " " + window.location.href)}`);
            }
        }
    </script>
</body>
</html>
